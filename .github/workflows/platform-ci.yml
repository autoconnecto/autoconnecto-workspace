# Platform CI — keep build/typecheck green on every PR
#
# Confirmed scope: compile gates only (no live Postgres/Redis/MQTT in Actions).
# Local deep gate: `cd backend && npm run smoke:local` (+ optional SMOKE_DEVICE_TOKEN).

name: Platform CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Swagger contract
        run: npm run swagger:check
        env:
          CI: "true"
          # Export boots Nest without a live broker/DB; stubs keep pool init quiet.
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          DB_USER: "ci"
          DB_PASSWORD: "ci"
          DB_NAME: "ci"
          REDIS_URL: "redis://127.0.0.1:6379"
      - name: Migration files present
        run: |
          test -d migrations
          test -n "$(ls migrations/*.sql 2>/dev/null | head -1)"

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
