<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Autoconnecto">
  <rect width="128" height="128" rx="28" fill="#115E59"/>
  <!-- One spoke, rotated 6× around centre — lengths cannot differ -->
  <g transform="translate(64 64)" stroke="#6EE7B7" stroke-width="3.5" stroke-linecap="round" fill="#A7F3D0">
    <g transform="rotate(0)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
    <g transform="rotate(60)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
    <g transform="rotate(120)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
    <g transform="rotate(180)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
    <g transform="rotate(240)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
    <g transform="rotate(300)"><line x1="0" y1="-22" x2="0" y2="-37"/><circle cx="0" cy="-44" r="7"/></g>
  </g>
  <circle cx="64" cy="64" r="22" fill="#A7F3D0"/>
  <!-- A + wifi optically centred in the hub -->
  <text x="64" y="72.5" text-anchor="middle" fill="#115E59" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">A</text>
  <g fill="none" stroke="#115E59" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="55" r="1.4" fill="#115E59" stroke="none"/>
    <path d="M60.2 52.5 A4.5 4.5 0 0 1 67.8 52.5" stroke-width="1.8"/>
    <path d="M57.8 49.8 A7.5 7.5 0 0 1 70.2 49.8" stroke-width="1.8"/>
  </g>
</svg>
